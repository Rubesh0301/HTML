<html>
<head>
    <style>
        .container{
            display:grid;
            grid-template-columns: auto auto auto;
            
            background-color:rgb(89, 99, 109);
            justify-content: start;
            padding:10px;
          
        } .container div{
            background-color:#f1f1f1;
            border:1px solid black;
            padding:10px;
            font-size:30px;
        }
         .container1{
            display:grid;
            grid-template-columns: auto auto auto;
           
            background-color:rgb(89, 99, 109);
            justify-content: end;
            padding:10px;
          
        }
        .container1 div{
            background-color:#f1f1f1;
            border:1px solid black;
            padding:10px;
            font-size:30px;
        } </style>
        <body>
            <h1> Grid Layout</h1>
            <p> Grid layout with six containers</p>
            <div class="container" align="center" >
              
                <div>1</div>
                <div>2</div>
                <div>3</div>
                <div>4</div>
                <div>5</div>
                <div>6</div>
            </div>
        </body>
        <body>
            <h1> Grid Layout</h1>
            <p> Grid layout with six containers</p>
            <div class="container1" align="center" >
              
                <div>1</div>
                <div>2</div>
                <div>3</div>
                <div>4</div>
                <div>5</div>
                <div>6</div>
            </div>
        </body>
</head>
</html>

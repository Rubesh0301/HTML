<universal selector>
<html>
<head>
<title> Universal selector</title>
<style>
*{
text-align:center;
color:blue;
}
</style>
</head>
<body>
<h1> Hello world</h1>
<p> Every element on the page will be affected by the style.</p>
<p id="para1">Hello world</p>
<p> And me !</p>
</body>
</html>
